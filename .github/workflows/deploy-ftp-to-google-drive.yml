name: Deploy ftp-to-google-drive

on:
  push:
    branches:
      - main
    paths:
      - 'aws/ftp-to-google-drive/**'

jobs:
  deploy:
    name: Zip and deploy to Lambda
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: aws/ftp-to-google-drive
        run: npm ci --omit=dev

      - name: Zip deployment package
        working-directory: aws/ftp-to-google-drive
        run: |
          zip -r ../ftp-to-google-drive.zip . \
            --exclude "*.zip" \
            --exclude ".gitignore"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            us-east-1

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code \
            --function-name ftp-to-google-drive \
            --zip-file fileb://aws/ftp-to-google-drive.zip
